<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Compass logo, TheChinaPath identity.

  Replaces the previous lockup, which carried the bearingbridge.com bridge mark,
  the "by Bearing Bridge" sub-wordmark and the old navy and cyan palette.
  Compass is a TheChinaPath service now, so the logo follows the parent:

    - Brand red   #C8102E  (the pin and the north needle on the master logo)
    - Ink         #1A1A1A  (the 中国路 characters on the master logo)
    - Serif wordmark, matching "TheChinaPath"

  The mark keeps the compass rose, which is the thing the product is named for,
  and sets it inside the same rounded pin silhouette the parent logo uses, so
  the two read as one family at small sizes in the footer strip.
-->
<svg
  width="100%"
  height="100%"
  viewBox="0 0 2380 575"
  version="1.1"
  xmlns="http://www.w3.org/2000/svg"
  xml:space="preserve"
  style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-linecap:round;"
  role="img"
  aria-label="Compass by TheChinaPath"
>
  <title>Compass by TheChinaPath</title>

  <!-- ============ Mark: a compass rose inside the TheChinaPath pin ============ -->
  <g transform="translate(325.5 287.5)">
    <!-- Pin silhouette. Circle head plus a tapered point, echoing the parent
         logo's map pin. Drawn once in brand red. -->
    <path
      d="M0,-232
         C 128,-232 232,-128 232,0
         C 232,104 164,178 84,208
         L 0,300
         L -84,208
         C -164,178 -232,104 -232,0
         C -232,-128 -128,-232 0,-232 Z"
      fill="#C8102E"
    />

    <!-- Rose, knocked out of the pin in white so it stays legible at 26px tall. -->
    <circle cx="0" cy="-8" r="150" fill="none" stroke="#FFFFFF" stroke-width="9" opacity="0.55" />
    <circle cx="0" cy="-8" r="118" fill="none" stroke="#FFFFFF" stroke-width="5" opacity="0.35" />

    <!-- Eight-point star: four long cardinal arms, four short ordinals. -->
    <path
      d="M0,-158 L26,-34 L150,-8 L26,18 L0,142 L-26,18 L-150,-8 L-26,-34 Z"
      fill="#FFFFFF"
      opacity="0.92"
    />
    <path
      d="M84,-92 L26,-30 L88,-88 Z M84,76 L26,14 L88,72 Z
         M-84,-92 L-26,-30 L-88,-88 Z M-84,76 L-26,14 L-88,72 Z"
      fill="#FFFFFF"
      opacity="0.5"
    />

    <!-- North needle, filled solid so the eye lands on it first. -->
    <path d="M0,-158 L26,-34 L-26,-34 Z" fill="#FFFFFF" />
    <circle cx="0" cy="-8" r="15" fill="#C8102E" stroke="#FFFFFF" stroke-width="7" />
  </g>

  <!-- ============ Wordmark ============ -->
  <!-- Serif, to sit in the same family as the TheChinaPath wordmark. The system
       serif stack keeps this China-safe: no webfont, no external CDN. -->
  <text
    x="700"
    y="286"
    font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif"
    font-weight="700"
    font-size="330"
    letter-spacing="-4"
    fill="#1A1A1A"
  >Compass</text>

  <!-- Sub-wordmark, spanning the width of the word above it, in brand red. -->
  <text
    x="704"
    y="470"
    font-family="Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif"
    font-weight="600"
    font-size="152"
    letter-spacing="1"
    fill="#C8102E"
  >by TheChinaPath</text>
</svg>
