# The service desk bubble on this website answers from the website's own
# pages (a desk in BearingBridge Intelligence, Service Desk). When a
# Production deploy succeeds, this asks the app to read the site again now:
# the sitemap first, then only the pages that are new, changed or gone, so a
# page published today is in the assistant's answers within minutes. The
# nightly sync in the app stays as the safety net. The same workflow is
# installed in every website repo in C:\Users\cyril\Project; only SITE_URL
# differs.
name: Desk refresh

on:
  deployment_status:
  workflow_dispatch:

permissions: {}

concurrency:
  group: desk-refresh
  cancel-in-progress: false

env:
  SITE_URL: https://www.thechinapath.com

jobs:
  refresh:
    # deployment_status fires on every state change; only a successful
    # Production deploy changes what the assistant should know.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       startsWith(github.event.deployment.environment, 'Production'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Let the production domain switch to the new deploy
        if: github.event_name == 'deployment_status'
        run: sleep 30

      - name: Ask the service desk to read the site again
        run: |
          curl -sS --fail-with-body --max-time 60 -X POST \
            -H 'Content-Type: application/json' \
            "https://intelligence.bearingbridge.com/api/public/desk-refresh?site=${SITE_URL}"
