<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
  /* The site's dark hero: system sans, a white row, a red italic row,
     a white row on a red underline. Charcoal from the logo pack. */
  :root { --red: #c8102e; --charcoal: #202428; }
  html, body { margin: 0; width: 1500px; height: 500px; overflow: hidden; }
  body {
    position: relative; color: #fff; background: var(--charcoal);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  /* Copy: upper left, ends above the avatar zone (y > 320 at x < 420). */
  .copy { position: absolute; left: 92px; top: 52px; }
  .eyebrow { font-size: 15px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgb(255 255 255 / 0.66); }
  h1 { margin: 14px 0 0; font-size: 58px; line-height: 1.04; letter-spacing: -0.025em; font-weight: 700; }
  h1 span { display: block; }
  h1 .accent { color: var(--red); font-weight: 500; font-style: italic; letter-spacing: -0.018em; }
  h1 .hl { position: relative; display: inline-block; padding: 0 0.12em; margin-left: -0.12em; z-index: 0; }
  h1 .hl::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0.04em; height: 0.18em; background: var(--red); border-radius: 2px; z-index: -1; }

  svg.route { position: absolute; inset: 0; }
  .stop { position: absolute; font-size: 22px; font-weight: 600; white-space: nowrap; }
  .pin { position: absolute; width: 128px; height: 128px; }
  .url { position: absolute; right: 92px; bottom: 34px; font-size: 17px; letter-spacing: 0.04em; color: rgb(255 255 255 / 0.55); }
</style></head>
<body>
  <div class="copy">
    <div class="eyebrow">Marketing and eCommerce in China</div>
    <h1><span>Sell in China.</span><span class="accent">Grow in China.</span><span class="hl">Understand China.</span></h1>
  </div>

  <!-- The brand's idea, a route through a market: the road from the pin,
       winding through the platforms the agency runs, ending at the pin. -->
  <svg class="route" width="1500" height="500" xmlns="http://www.w3.org/2000/svg">
    <path id="road" d="M 640 440 C 850 440, 760 296, 970 296 C 1180 296, 1090 168, 1290 168"
          fill="none" stroke="rgb(255 255 255 / 0.16)" stroke-width="16" stroke-linecap="round"/>
    <path d="M 640 440 C 850 440, 760 296, 970 296 C 1180 296, 1090 168, 1290 168"
          fill="none" stroke="rgb(255 255 255 / 0.55)" stroke-width="2" stroke-dasharray="10 12" stroke-linecap="round"/>
    <g id="dots"></g>
  </svg>
  <div id="stops"></div>
  <img class="pin" id="pin" src="../../../public/thechinapath-logo-pack/logo-mark.png" alt="">
  <div class="url">thechinapath.com</div>

<script>
  const road = document.getElementById('road');
  const L = road.getTotalLength();
  // The platforms named in the site's own description, in the order a launch
  // usually meets them. Label side chosen so no label crosses the road.
  const stops = [
    { t: 0.04, label: 'Tmall', side: 'above' },
    { t: 0.27, label: 'JD', side: 'below' },
    { t: 0.50, label: 'Douyin', side: 'above' },
    { t: 0.70, label: 'WeChat', side: 'below' },
    { t: 0.89, label: 'RED', side: 'above' },
  ];
  const NS = 'http://www.w3.org/2000/svg';
  for (const s of stops) {
    const p = road.getPointAtLength(s.t * L);
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', 9);
    c.setAttribute('fill', '#202428'); c.setAttribute('stroke', '#ffffff'); c.setAttribute('stroke-width', 3);
    document.getElementById('dots').appendChild(c);
    const d = document.createElement('div');
    d.className = 'stop'; d.textContent = s.label;
    d.style.left = p.x + 'px'; d.style.top = (s.side === 'above' ? p.y - 46 : p.y + 18) + 'px'; d.style.transform = 'translateX(-50%)';
    document.getElementById('stops').appendChild(d);
  }
  // The pin stands on the end of the road, its tip on the last point.
  const end = road.getPointAtLength(L);
  const pin = document.getElementById('pin');
  pin.style.left = (end.x - 64) + 'px';
  pin.style.top = (end.y - 118) + 'px';
</script>
</body></html>
